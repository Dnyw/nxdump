name: Core extraction tests

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-byte-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Run AES and extraction byte-exact tests
        run: sh core/test/run_tests.sh
